name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trials
          POSTGRES_PASSWORD: trials
          POSTGRES_DB: trials_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trials"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://trials:trials@localhost:5432/trials_test' || '' }}
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinical-trials-api .
